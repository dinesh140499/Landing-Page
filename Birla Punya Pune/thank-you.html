<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Thank You | Birla Punya, Central Pune</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#3B2C6B">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,700;1,400&family=Poppins:wght@400;500;600&display=swap">
  <link rel="icon" type="image/webp" href="assets/images/brand/birla-punya-logo.webp">
  <style>
    :root{--plum:#3B2C6B;--plum-9:#271C4A;--lav:#6E5DB8;--lav-l:#ECE8F7;--ivory:#FAF7F1;--gold:#C29A55;--gold-l:#E3C489;--terra:#B4553A;--ink:#221F2B;--ink-2:#5E5A6B;--line:rgba(34,31,43,.12)}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{min-height:100svh;display:grid;grid-template-columns:1fr;background:var(--ivory);color:var(--ink);font:400 16px/1.6 Poppins,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    img{display:block;max-width:100%}
    a{color:inherit;text-decoration:none}
    .media{position:relative;overflow:hidden;background:var(--plum);min-height:100%}
    .media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:z 9s ease-out both}
    @keyframes z{from{transform:scale(1.08)}}
    .media span{position:absolute;right:12px;bottom:10px;font-size:10.5px;color:#fff;background:rgba(0,0,0,.38);padding:2px 9px;border-radius:99px}
    .msg{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:100svh;padding:clamp(28px,6vw,90px);background:radial-gradient(circle,rgba(110,93,184,.12) 1.2px,transparent 1.8px) 0 0/20px 20px,var(--ivory)}
    .msg::before{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,90vw);height:min(690px,90svh);background:url(assets/images/pattern/gate-lav.webp) center/contain no-repeat;opacity:.1;pointer-events:none}
    .msg>*{position:relative;max-width:520px}
    .logos{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:clamp(22px,4vh,40px)}
    .logos img{height:56px;width:auto}
    .logos i{width:1px;height:42px;background:var(--line)}
    .tick{width:68px;height:68px;margin-bottom:20px}
    .tick circle{fill:var(--plum)}
    .tick path{fill:none;stroke:var(--gold-l);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:d .7s .3s ease forwards}
    @keyframes d{to{stroke-dashoffset:0}}
    h1{font:700 clamp(32px,4.2vw,54px)/1.1 "PT Serif",Georgia,serif;color:var(--plum)}
    h1 em{display:block;font-style:italic;font-weight:400;color:var(--gold);font-size:.62em;margin-top:6px}
    .line{width:150px;margin:18px auto}
    p{color:var(--ink-2);margin:0 0 26px;font-size:16px}
    .btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 26px;border-radius:99px;font-weight:600;font-size:14.5px;border:1.5px solid var(--plum);color:var(--plum);transition:background .3s,color .3s}
    .btn:hover{background:var(--plum);color:#fff}
    .btn--plum{background:var(--plum);color:#fff}
    .btn--plum:hover{background:var(--plum-9)}
    @media (max-width:800px){
      body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
      .media{height:34svh;min-height:200px}
      .msg{align-items:center;text-align:center;padding:28px 20px 36px}
      .logos{justify-content:center}
      .logos img{height:44px}
      .line{margin:14px auto}
      .btns{width:100%;flex-direction:column}
      .btn{width:100%}
      .msg::before{width:220px;height:280px}
    }
  </style>
</head>
<body>
  <main class="msg">
    <div class="logos"><img src="assets/images/brand/birla-punya-logo.webp" width="664" height="352" alt="Birla Punya by Birla Estates"><i></i><img src="assets/images/brand/aditya-birla-group.webp" width="270" height="300" alt="Aditya Birla Group"></div>
    <svg class="tick" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="36"/><path d="M22 37l10 10 19-21"/></svg>
    <h1>Thank you<span id="nm"></span>! <em>We'll be in touch shortly.</em></h1>
    <img class="line" src="assets/images/pattern/line-gold.webp" width="259" height="13" alt="" aria-hidden="true">
    <p>Your enquiry for Birla Punya has reached us. Our relationship manager will call you with the price sheet, brochure and site-visit options.</p>
    <div class="btns"><a class="btn btn--plum" href="index.html">Back to website</a><a class="btn" href="tel:+919126264444">Call us now</a></div>
  </main>
  <script>
    var n = new URLSearchParams(location.search).get('name');
    if (n) document.getElementById('nm').textContent = ' ' + n.replace(/[^\p{L} .'-]/gu, '').slice(0, 30);
  </script>
</body>
</html>
