<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Thank You | Birla Punya, Central Pune</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#3B2C6B">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,700;1,400&family=Poppins:wght@400;500;600&display=swap">
  <link rel="icon" type="image/svg+xml" href="assets/images/brand/birla-punya-logo.svg">
  <style>
    :root{--plum:#3B2C6B;--plum-9:#271C4A;--lav:#6E5DB8;--ivory:#FAF7F1;--gold:#C29A55;--terra:#B4553A;--ink:#221F2B;--ink-2:#5E5A6B;--line:rgba(34,31,43,.12)}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100svh;display:grid;grid-template-columns:1fr 1fr;background:var(--ivory);color:var(--ink);font:400 16px/1.6 Poppins,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    img{display:block;max-width:100%}
    a{color:inherit;text-decoration:none}
    .media{position:relative;overflow:hidden;background:var(--plum)}
    .media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:z 9s ease-out both}
    @keyframes z{from{transform:scale(1.08)}}
    .media span{position:absolute;right:12px;bottom:10px;font-size:10.5px;color:#fff;background:rgba(0,0,0,.38);padding:2px 9px;border-radius:99px}
    .msg{display:flex;flex-direction:column;justify-content:center;padding:clamp(36px,7vw,90px)}
    .msg>*{max-width:520px}
    .logo{width:150px;margin-bottom:34px}
    .tick{width:72px;height:72px;margin-bottom:22px}
    .tick circle{fill:var(--plum)}
    .tick path{fill:none;stroke:var(--gold);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:d .7s .3s ease forwards}
    @keyframes d{to{stroke-dashoffset:0}}
    h1{font:700 clamp(36px,4.4vw,56px)/1.1 "PT Serif",Georgia,serif;color:var(--plum)}
    h1 em{font-style:italic;font-weight:400;color:var(--lav)}
    p{color:var(--ink-2);margin:16px 0 28px;font-size:17px}
    .btns{display:flex;gap:12px;flex-wrap:wrap}
    .btn{display:inline-flex;padding:14px 26px;border-radius:99px;font-weight:700;font-size:14.5px;border:1.5px solid var(--plum);color:var(--plum)}
    .btn--plum{background:var(--plum);color:#fff}
    @media (max-width:800px){body{grid-template-columns:1fr}.media{height:38svh}}
  </style>
</head>
<body>
  <div class="media"><img src="assets/images/hero/hero-2-lg.webp" alt="Birla Punya, Central Pune"><span>Artist's impression</span></div>
  <main class="msg">
    <img class="logo" src="assets/images/brand/birla-punya-logo.svg" width="333" height="177" alt="Birla Punya by Birla Estates">
    <svg class="tick" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="36"/><path d="M22 37l10 10 19-21"/></svg>
    <h1>Thank you<span id="nm"></span>, <em>we'll be in touch.</em></h1>
    <p>Your enquiry for Birla Punya has reached us. Our relationship manager will call you shortly with the price sheet, brochure and site-visit options.</p>
    <div class="btns"><a class="btn btn--plum" href="index.html">Back to website</a><a class="btn" href="tel:+919126264444">Call us now</a></div>
  </main>
  <script>
    var n = new URLSearchParams(location.search).get('name');
    if (n) document.getElementById('nm').textContent = ' ' + n.replace(/[^\p{L} .'-]/gu, '').slice(0, 30);
  </script>
</body>
</html>
